<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aspect Ratio</title>
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #222; }
  .container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    border: 2px solid green;
  }
  canvas {
    background: black;
    aspect-ratio: 16 / 9;
    max-width: 100%;
    max-height: 100%;
    /* No width/height 100% */
  }
</style>
</head>
<body>
  <div class="container">
    <canvas width="1280" height="720"></canvas>
  </div>
</body>
</html>
